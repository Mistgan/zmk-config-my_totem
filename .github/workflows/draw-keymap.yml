name: Draw Keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "keymap_drawer.config.yaml"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install keymap-drawer
        run: python3 -m pip install keymap-drawer

      - name: Draw Keymap
        id: draw
        run: |
          mkdir -p img
          keymap parse -c 10 -z config/my_totem.keymap > totem.yaml     
          keymap draw totem.yaml -s keymap_drawer.config.yaml > img/totem.svg
          rm totem.yaml

      - name: Commit updated image
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update keymap layout image"
          file_pattern: img/*.svg