name: Draw ZMK Keymap
on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "keymap_drawer.config.yaml"
      - ".github/workflows/draw-keymap.yml"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/*.keymap"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "img"
      parse_args: "-DFR_ESCAPE_CHARACTER=FR_ESC_CHAR -DFR_FILE_SEPARATOR=FR_FILE_SEP -DFR_GROUP_SEPARATOR=FR_GROUP_SEP"
      draw_args: "-k totem"