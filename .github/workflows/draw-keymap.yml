name: Draw Keymap

on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "keymap_drawer.config.yaml"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install keymap-drawer
        run: python3 -m pip install keymap-drawer

      - name: Draw Keymap
        id: draw
        run: |
          mkdir -p img
          # Cette commande parse ton fichier .keymap et génère le SVG
          # Adapte "config/totem.keymap" si ton fichier s'appelle autrement !
          keymap parse -c 10 -z config/totem.keymap > totem.yaml
          
          # Génération de l'image SVG
          # On utilise ton fichier de config s'il existe
          keymap draw totem.yaml -s keymap_drawer.config.yaml > img/totem.svg
          
          # Nettoyage du fichier temporaire
          rm totem.yaml

      - name: Commit updated image
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update keymap layout image"
          file_pattern: img/*.svg